name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests, lint and both APKs. Device tests need a phone and are run locally.
      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: host-app-debug
          path: host-app/build/outputs/apk/debug/host-app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
