name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version and edition
      description: Settings → About. Standard or full edition?
      placeholder: "1.0.0 standard"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 7, Android 15"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, and the smallest module that shows it
      description: Paste the script. Remove tokens and passwords first.
      render: text
  - type: textarea
    id: output
    attributes:
      label: Module output or error text
      render: text
