name: Idea
description: Something a module cannot do yet, or an API that would be easier
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to build?
      description: The scenario matters more than the API you imagine.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today?
      description: What you tried and where it stops.
  - type: textarea
    id: safety
    attributes:
      label: Which permission would this need, and what could go wrong?
      description: ModuForge keeps every capability behind an explicit user permission; a short note helps.
